[workspace]
members = ["crates/tiler"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Erik Brinkman <erik.brinkman@gmail.com>"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
