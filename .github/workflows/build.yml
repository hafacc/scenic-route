name: build

# Only main pushes build, sparing a Sapling stack's commits; the scheduled jobs' outputs are ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/sheds/**"
      - "public/ferry-schedule/**"
      - "public/transit-schedule/**"
      - "public/addresses/**"
      - "public/search/**"
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pointers even on deploy: data/ is the sole draw on LFS bandwidth, so the deploy uses a cache.
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
      # Pinned to match rust-toolchain.toml; move both together.
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      # scripts holds the build-time invariants, so a broken city fails here rather than mid-ingest.
      - run: bun test src scripts components
      # Fails a graph-input change without `build-sheds`; it reads only LFS pointer text.
      - run: bun run check-shed-inputs
      # The 1.6 GB DEM; upstream never changes a published collection, so the key tracks its URL.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: .cache/werk-*.bin
          key: dem-${{ hashFiles('scripts/elevation.ts', 'src/tree-cover/manifest.json') }}
          restore-keys: |
            dem-
      # Pointers carry their object's sha256, so hashing them keys on content; after check-shed-inputs.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('data/**') }}
          # A partial hit is worth having: `git lfs pull` then fetches only the new objects.
          restore-keys: |
            lfs-
      - if: inputs.upload-pages
        run: git lfs pull

      # The render is expensive and only the Pages deploy consumes it, so it runs only on that path.
      - if: inputs.upload-pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      # Keyed per run so the newest set restores; each pass's own stamp decides what re-renders.
      - if: inputs.upload-pages
        uses: actions/cache/restore@v6
        id: tiles
        with:
          path: &tiles |
            public/tiles
            public/casters
            public/routing
            public/streets
            public/commercial
            public/commercial-lines
            public/trees
            public/landmarks
            public/art
            public/ferries
            public/highways
            public/dining
            public/openstreets
            public/landuse
            .build/graph-cache
          key: tiles-${{ github.run_id }}
          restore-keys: |
            tiles-
      - if: inputs.upload-pages
        run: bun export
      # Saved right after the render, even on failure, so a later failure still banks finished passes.
      - if: inputs.upload-pages && always()
        uses: actions/cache/save@v6
        with:
          path: *tiles
          key: tiles-${{ github.run_id }}
      # Sheds placed against another graph silently vanish from the map, so block the mismatch here.
      - if: inputs.upload-pages
        run: bun run check-sheds
      # Needs the freshly built graph and real LFS files, which only this path has.
      - if: inputs.upload-pages
        run: bun run test-routes
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
