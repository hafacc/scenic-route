name: sheds

# The DOB feed regenerates ~09:47 ET, so 15:00 UTC is after it; a late run catches up the next day.
# Schedules die after 60 days without a push, and this job's daily push to main keeps them alive.
# A disabled workflow can't re-enable itself; don't add a keepalive, GitHub bans them as abuse.
# The push paths are what decides the timetables' bytes; this job's own outputs must stay out.
on:
  schedule:
    - cron: "0 15 * * *"
  push:
    branches: [main]
    paths:
      # The two scripts and everything they import, transitively.
      - "scripts/ferry-schedule.ts"
      - "scripts/transit-schedule.ts"
      - "scripts/alameda.ts"
      - "scripts/arcgis.ts"
      - "scripts/cache.ts"
      - "scripts/csv.ts"
      - "scripts/ferries.ts"
      - "scripts/geometry.ts"
      - "scripts/gtfs.ts"
      - "scripts/http.ts"
      - "scripts/land-filter.ts"
      - "scripts/land.ts"
      - "scripts/manifest.ts"
      - "scripts/overpass.ts"
      - "scripts/schedule-record.ts"
      - "scripts/sf.ts"
      - "scripts/socrata.ts"
      - "scripts/streets.ts"
      - "scripts/subway-format.ts"
      - "scripts/transit.ts"
      - "src/tiles/varint.ts"
      - "data/transit/**"
      - "data/ferries/**"
      - ".github/workflows/sheds.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sheds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # No LFS: it would spend the account's bandwidth, and `raw` serves an LFS file as its pointer.
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Runners share egress IPs and anonymous Socrata is throttled per IP, hence the app token.
      # Records what this runner can reach, since those failures never reproduce from a laptop.
      - run: bash scripts/socrata-probe.sh
        continue-on-error: true
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      # Places sheds against the deployed graph, so their edge keys are the ones the client resolves.
      - run: bun run update-sheds
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_VERBOSE: "1"

      # Writes only public/ferry-schedule/; the LFS zips under data/ferries/ must never be written here.
      - run: bun run update-ferry-schedule

      # Writes only public/transit-schedule/; data/transit/ is a graph input rebuilt by hand.
      - run: bun run update-transit-schedule

      # Never track these in LFS: git deltas them to a few KB a day, LFS would store every copy.
      # No --force-with-lease: its lease is this checkout's fetch, which is the push it would clobber.
      - name: commit the artifacts
        run: |
          staged="$(mktemp -d)"
          mkdir -p "$staged/sheds" "$staged/ferry-schedule" "$staged/transit-schedule"
          cp public/sheds/*.bin "$staged/sheds/"
          cp public/ferry-schedule/*.bin "$staged/ferry-schedule/"
          cp public/transit-schedule/*.bin "$staged/transit-schedule/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --quiet --hard FETCH_HEAD
            mkdir -p public/sheds public/ferry-schedule public/transit-schedule
            cp "$staged"/sheds/*.bin public/sheds/
            cp "$staged"/ferry-schedule/*.bin public/ferry-schedule/
            cp "$staged"/transit-schedule/*.bin public/transit-schedule/
            git add public/sheds public/ferry-schedule public/transit-schedule
            if git diff --quiet --cached; then
              echo "the artifact is unchanged; nothing to commit"
              exit 0
            fi
            git commit --quiet -m "chore(data): update the daily artifacts through $(date -u +%F)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under the push; rebuilding the commit on the new tip"
          done
          exit 1
