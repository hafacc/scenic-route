name: automerge

# Not in build.yml: a reused workflow can only narrow its caller's token, so these scopes would break it.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nothing is checked out, so gh has no remote to infer the repo from.
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$BRANCH"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
