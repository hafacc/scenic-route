name: search-data

# Monthly because the .gz artifacts don't delta in git, so each refresh adds ~12 MB of history.
# Builders sort before writing, so an unchanged month gives identical bytes and commits nothing.
# The 5th because GitHub's cron is least reliable at popular slots like the 1st.
# This job can't keep its own schedule alive, since it usually commits nothing; sheds.yml does.
on:
  schedule:
    - cron: "0 17 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # No LFS, to spare the account's bandwidth; the LFS blobs it needs come off the site instead.
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Indexes the deployed graph, so every name is one the app can route to; a 404 means absent.
      - name: what the deployed site is serving
        env:
          SITE: https://hafa.cc/scenic-route
        run: |
          mkdir -p public/routing
          for name in nyc.bin nyc.version.json sf.bin sf.version.json; do
            curl --fail --silent --show-error --location \
              --output "public/routing/$name" "$SITE/routing/$name"
          done
          for set in art dining landmarks legacy subway; do
            mkdir -p "public/$set"
            for city in nyc sf; do
              code="$(curl --silent --show-error --location \
                --write-out '%{http_code}' \
                --output "public/$set/$city.bin" "$SITE/$set/$city.bin")"
              case "$code" in
                200) ;;
                404) rm -f "public/$set/$city.bin" ;;
                *) echo "$SITE/$set/$city.bin: HTTP $code" >&2; exit 1 ;;
              esac
            done
          done

      # Not the pin in scripts/places.ts: Overture's bucket keeps only its last two releases.
      - name: the newest Overture release
        run: |
          listing="https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&delimiter=/&prefix=release/"
          release="$(curl --fail --silent --show-error "$listing" \
            | tr '<' '\n' \
            | sed -n 's|^Prefix>release/\([0-9-]*\.[0-9]*\)/$|\1|p' \
            | sort | tail -1)"
          if [ -z "$release" ]; then
            echo "$listing named no release; has the bucket or its layout moved?" >&2
            exit 1
          fi
          echo "reading Overture $release"
          echo "OVERTURE_RELEASE=$release" >> "$GITHUB_ENV"

      # Never restore .cache/ in this job: it never expires, so it would pin every month's data.
      - run: bun run update-addresses

      - run: bun run update-places

      - run: bun run update-search-index
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_VERBOSE: "1"

      # No --force-with-lease: its lease is this checkout's fetch, which is the push it would clobber.
      - name: commit the artifacts
        run: |
          staged="$(mktemp -d)"
          mkdir -p "$staged/addresses" "$staged/search"
          cp public/addresses/*.bin.gz "$staged/addresses/"
          cp public/search/*.bin.gz "$staged/search/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --quiet --hard FETCH_HEAD
            mkdir -p public/addresses public/search
            cp "$staged"/addresses/*.bin.gz public/addresses/
            cp "$staged"/search/*.bin.gz public/search/
            git add public/addresses public/search
            if git diff --quiet --cached; then
              echo "the artifacts are unchanged; nothing to commit"
              exit 0
            fi
            git commit --quiet -m "chore(data): refresh the search artifacts from Overture $OVERTURE_RELEASE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under the push; rebuilding the commit on the new tip"
          done
          exit 1
