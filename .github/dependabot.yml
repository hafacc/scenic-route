version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # svelte-check needs TypeScript 6's JS API; 7.0 is the native compiler.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Its refs are Rust versions, pre-created ahead of release; rust-toolchain.toml owns the pin.
      - dependency-name: "dtolnay/rust-toolchain"
